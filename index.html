<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14121f">
<title>Misi Harmoni - Petualangan Sosiologi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2314121f'/%3E%3Cpath d='M8 1l4 5-4 9-4-9z' fill='%2343e0e0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="hud-row"><div id="hearts"></div><div id="poin"></div></div>
  <div class="hud-row"><div id="shards"></div></div>
  <div id="chlabel"></div>
  <div id="questline"></div>
</div>
<div id="hudbtns" class="hidden">
  <button id="btn-quest" class="mini">Misi</button>
  <button id="btn-journal" class="mini">Jurnal</button>
  <button id="btn-menu" class="mini">Menu</button>
</div>

<div id="controls" class="hidden">
  <div id="dpad">
    <button data-dir="up" class="d up" aria-label="Atas">▲</button>
    <button data-dir="left" class="d left" aria-label="Kiri">◀</button>
    <button data-dir="right" class="d right" aria-label="Kanan">▶</button>
    <button data-dir="down" class="d down" aria-label="Bawah">▼</button>
  </div>
  <button id="btn-a" data-act="1" aria-label="Aksi">A</button>
</div>

<div id="dialog" class="hidden">
  <canvas id="dlg-portrait" width="64" height="64"></canvas>
  <div class="dlg-main">
    <div id="dlg-name"></div>
    <div id="dlg-text"></div>
    <div id="dlg-choices"></div>
  </div>
  <div id="dlg-hint">▼</div>
</div>

<div id="battle" class="hidden">
  <div class="b-head">
    <img id="b-img" alt="">
    <div class="b-info">
      <div id="b-name"></div>
      <div class="bar"><i id="b-hp"></i></div>
      <div id="b-hearts"></div>
    </div>
  </div>
  <div class="b-card">
    <div id="b-q"></div>
    <div id="b-opts"></div>
    <div id="b-expl"></div>
    <button id="b-next" class="btn hidden">Lanjut ▶</button>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="m-box">
    <div class="m-head"><span id="m-title"></span><button id="m-close" class="mini" aria-label="Tutup">✕</button></div>
    <div id="m-body"></div>
  </div>
</div>

<div id="story" class="hidden"><div id="story-text"></div><div id="story-hint">ketuk untuk lanjut ▼</div></div>
<div id="banner" class="hidden"><div id="banner-1"></div><div id="banner-2"></div></div>
<div id="fade"></div>
<div id="toast"></div>

<div id="ending" class="hidden">
  <div class="t-box">
    <h1>MISI<br>SELESAI!</h1>
    <p class="sub">Kristal Harmoni utuh kembali</p>
    <div id="end-stats"></div>
    <button id="end-cont" class="btn big">Lanjut menjelajah</button>
    <button id="end-title" class="btn big">Ke judul</button>
  </div>
</div>

<div id="title">
  <div class="t-box">
    <h1>MISI<br>HARMONI</h1>
    <p class="sub">Petualangan Sosiologi di Desa Sukamaju</p>
    <label class="name-label">Nama petualang
      <input id="in-name" maxlength="14" placeholder="Sasi" autocomplete="off">
    </label>
    <div class="looks-label">Pilih karakter</div>
    <div id="looks"></div>
    <button id="btn-new" class="btn big">Mulai baru</button>
    <button id="btn-cont" class="btn big hidden">Lanjutkan</button>
    <p class="hint">Jalan: panah, WASD, atau D-pad. Bicara dan aksi: Spasi, Enter, atau tombol A. Menu: Esc.</p>
  </div>
</div>

<noscript>Game ini membutuhkan JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
